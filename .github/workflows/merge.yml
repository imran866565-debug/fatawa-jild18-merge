name: Merge Jild 18 tashreeh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild18.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('jild-18.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', sum(1 for it in items if not it.get('tashreeh_jawab')))
          print('empty sawal:', [it['id'] for it in items if not it.get('tashreeh_sawal')])
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('start_page==min(pages) all:', all(it.get('start_page') == min(it['pages']) for it in items))
          combined = {
              'jild18-masala-42-43': list(range(183, 195)),
              'jild18-masala-59': list(range(237, 242)),
              'jild18-masala-76': [289, 290],
              'jild18-masala-83': list(range(318, 358)),
              'jild18-masala-90': list(range(389, 405)),
              'jild18-masala-94': list(range(414, 466)),
              'jild18-masala-112': list(range(487, 501)),
              'jild18-masala-114': list(range(509, 565)),
              'jild18-masala-126': [589, 590],
              'jild18-masala-141': list(range(624, 658)),
              'jild18-masala-142': list(range(657, 709)),
          }
          for cid, expected_pages in combined.items():
              hits = [it for it in items if it['id'] == cid]
              print(cid, 'items:', len(hits), 'pages:', hits[0]['pages'][0], '-', hits[0]['pages'][-1], f'({len(hits[0]["pages"])} pages)' if hits else None)
              assert len(hits) == 1
              assert hits[0]['pages'] == expected_pages, f'{cid}: pages mismatch'
              assert hits[0].get('tashreeh_sawal'), f'{cid}: sawal empty'
              assert hits[0].get('tashreeh_jawab'), f'{cid}: jawab empty'
          # absorbed ids must be gone
          absorbed = ['jild18-ansah-sawal-1', 'jild18-ansah-sawal-2',
                      'jild18-p440', 'jild18-p442', 'jild18-p444', 'jild18-p446',
                      'jild18-p447', 'jild18-p450', 'jild18-p452', 'jild18-p454',
                      'jild18-p456', 'jild18-p459', 'jild18-p461', 'jild18-p463']
          for sid in absorbed:
              assert not any(it['id'] == sid for it in items), f'{sid} should have been combined away'
          print(f'{len(absorbed)} absorbed ids gone')
          # distinct items kept separate (shared boundary pages are legitimate)
          for did, exp_pages in [
                  ('jild18-masala-113', [500] + list(range(502, 511))),
                  ('jild18-masala-86', list(range(308, 318))),
                  ('jild18-p359', list(range(359, 365))),
                  ('jild18-masala-18', [126]),
                  ('jild18-masala-18-19', [126, 127]),
                  ('jild18-masala-66', list(range(255, 277))),
                  ('jild18-khatima', [736])]:
              hits = [it for it in items if it['id'] == did]
              assert len(hits) == 1, f'{did}: expected exactly 1 item'
              assert hits[0]['pages'] == exp_pages, f'{did}: pages mismatch'
              print(did, 'present (kept separate)')
          assert not any(it['id'] == 'jild18-masala-85' for it in items), 'masala-85 must not exist'
          print('masala-85 correctly absent')
          assert len(items) == 126
          assert len(pages) == 644
          assert min(pages) == 5 and max(pages) == 736
          assert len(set(it['id'] for it in items)) == len(items)
          assert all(it.get('tashreeh_jawab') for it in items)
          assert {it['id'] for it in items if not it.get('tashreeh_sawal')} == {
              'jild18-pesh-lafz', 'jild18-masala-66', 'jild18-khatima'}
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la jild-18.json
          gh release create v1.0 jild-18.json --title "Jild 18 tashreeh - merged" --notes "Merged tashreeh for Fatawa Razviya Jild 18: 126 items, 644 pages (volume_id 46, pp. 5-736, 88 source-DB gap pages). Generated by merge_jild18.py from the 13 chunk files; 11 combine cases (masala-42-43, -59, -76, -83, -90 three-way, -94 thirteen-way, -112, -114, -126, -141, -142)." || gh release upload v1.0 jild-18.json --clobber
